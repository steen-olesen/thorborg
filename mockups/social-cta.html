<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social CTA — Klippen Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #E9E9E0;
    --dark: #2F2E2E;
    --terracotta: #E37B5B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: #f4f2ec;
    font-family: "Source Sans 3", Arial, sans-serif;
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    justify-content: center;
    align-items: flex-start;
  }
  figure { margin: 0; text-align: center; }
  figcaption {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9a978d;
  }
  .canvas {
    background: var(--cream);
    color: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 9%;
  }
  .feed { width: min(360px, 85vw); aspect-ratio: 1 / 1; }
  .story { width: min(220px, 60vw); aspect-ratio: 9 / 16; }
  .logo {
    font-family: "Source Serif 4", serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--terracotta);
    margin-bottom: 18px;
  }
  h2 {
    font-family: "Source Serif 4", serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  h2 em { font-style: normal; color: var(--terracotta); }
  .story h2 { font-size: 18px; }
  p.sub {
    font-size: 13px;
    font-weight: 300;
    color: #5b5a58;
    max-width: 85%;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .cta {
    background: var(--terracotta);
    color: white;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-size: 12px;
    padding: 11px 26px;
    border-radius: 3px;
  }
  .canvas.photo {
    background-image: linear-gradient(180deg, rgba(30,28,25,0.22) 0%, rgba(30,28,25,0.15) 45%, rgba(30,28,25,0.4) 100%), url('https://static.wixstatic.com/media/ff234e_f8894adc15d946dfb4e9bdd3f5ca0c87~mv2.png/v1/fill/w_1200,h_1200,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/hotel-havudsigt-bar.png');
    background-size: cover;
    background-position: center 55%;
    color: white;
  }
  .canvas.photo p.sub { color: #f3f1ec; }
  .canvas.photo .logo,
  .canvas.photo h2 em { color: #ffd9c7; }
  .canvas.photo *:not(.cta) { text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 2px 10px rgba(0,0,0,0.85); }
  .group-label {
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a19d90;
    margin: 0 0 -12px;
  }
  .mockup-tag {
    position: fixed; top: 14px; left: 14px;
    background: rgba(0,0,0,0.65); color: white;
    font-family: Arial, sans-serif; font-size: 11px;
    padding: 6px 10px; border-radius: 5px;
    z-index: 100;
  }
  .mockup-tag .desktop-hint { display: none; }
  @media (hover: none) {
    .mockup-tag .desktop-hint { display: inline; }
  }
</style>
</head>
<body>

  <div class="group-label">Cremet baggrund</div>

  <figure>
    <div class="canvas feed">
      <div class="logo">Klippen Hotel</div>
      <h2>Vind <em>en nat</em> med udsigt over Østersøen</h2>
      <p class="sub">Overnatning for 2 på Bornholms bedste udsigtsplads. Deltag på 30 sekunder.</p>
      <div class="cta">Deltag nu</div>
    </div>
    <figcaption>Feed-opslag · 1:1</figcaption>
  </figure>

  <figure>
    <div class="canvas story">
      <div class="logo">Klippen Hotel</div>
      <h2>Vind <em>en nat</em> med udsigt</h2>
      <p class="sub">Overnatning for 2. Deltag på 30 sekunder.</p>
      <div class="cta">Deltag nu</div>
    </div>
    <figcaption>Story · 9:16</figcaption>
  </figure>

  <div class="group-label">Foto-baggrund (udsigten fra terrassen)</div>

  <figure>
    <div class="canvas feed photo">
      <div class="logo">Klippen Hotel</div>
      <h2>Vind <em>en nat</em> med udsigt over Østersøen</h2>
      <p class="sub">Overnatning for 2 på Bornholms bedste udsigtsplads. Deltag på 30 sekunder.</p>
      <div class="cta">Deltag nu</div>
    </div>
    <figcaption>Feed-opslag · 1:1</figcaption>
  </figure>

  <figure>
    <div class="canvas story photo">
      <div class="logo">Klippen Hotel</div>
      <h2>Vind <em>en nat</em> med udsigt</h2>
      <p class="sub">Overnatning for 2. Deltag på 30 sekunder.</p>
      <div class="cta">Deltag nu</div>
    </div>
    <figcaption>Story · 9:16</figcaption>
  </figure>

  <div class="mockup-tag">Disse mockups er blot eksempler<span class="desktop-hint"> · Opleves bedst på desktop</span></div>

</body>
</html>
